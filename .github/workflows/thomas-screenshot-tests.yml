name: Thomas Screenshot Tests

# Pull requests opt in with the `run-ui-tests` label. Capture is Roborazzi under
# Robolectric, so the whole sweep is one JVM job on one Linux runner: no emulator,
# no sharding. The same job pixel-diffs the screenshots against the base branch's
# baselines and publishes the report to this repo's private GitHub Pages site (the
# `gh-pages` branch, which is not mirrored to the public repo), then comments on the PR.
# Every run publishes its own report and posts its own comment, collapsing the previous
# one as outdated, so the PR reads as a sequence rather than a single mutating comment.
# Intentional visual changes: add the `visual-change-accepted` label to make the
# diff report-only, then merge.
#
# A merge into `main` or `next` publishes fresh baselines as the
# `baselines-robolectric-<sdk>` artifact: the merged PR's own passing screenshots
# when they were taken against the current base (a file copy, no capture), a full
# capture otherwise. Scheduled runs only fire from the default branch, so the weekly
# job dispatches refreshes rather than minting itself; that keeps the artifacts from
# expiring on a quiet branch. Nothing image-shaped is ever committed: the public
# mirror would carry it forever.
#
# Every job is pinned to the private dev repo. On the public mirror the layouts
# deploy key does not exist, and publishing would drop screenshot reports onto the
# public Pages site next to the released SDK docs.
on:
  pull_request:
    # `labeled` so adding `run-ui-tests` starts a run and `visual-change-accepted`
    # re-runs in report-only mode; a plain re-run replays the original event payload.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main, next]
    # A merge that cannot change a pixel leaves the baselines alone.
    paths:
      - "urbanairship-layout/**"
      - "urbanairship-core/**"
      - "devapp/**"
      - "uitests/**"
      - "layouts.version"
      - "scripts/fetch-layouts.sh"
      - ".github/workflows/thomas-screenshot-tests.yml"
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

concurrency:
  # Keyed on the event too, because the weekly job dispatches a run on the branch it is itself
  # running from. Without it that dispatch lands in the schedule's own group and cancels it
  # mid-prune, so the weekly tidy-up would never finish.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  # A schedule only ever runs on the default branch, so mint by dispatch instead.
  refresh-baselines:
    if: github.repository == 'urbanairship/android-library-dev' && github.event_name == 'schedule'
    runs-on:
      labels: airship-large-runner
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          for ref in main next; do
            gh workflow run thomas-screenshot-tests.yml --repo "${{ github.repository }}" --ref "$ref"
          done

  prune-reports:
    if: github.repository == 'urbanairship/android-library-dev' && github.event_name == 'schedule'
    runs-on:
      labels: airship-large-runner
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: pages
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: gh auth setup-git
      - run: bash ./uitests/bin/uitest prune-reports

  screenshots:
    # PRs run only while labelled `run-ui-tests`; label events for other labels are ignored.
    if: >-
      github.repository == 'urbanairship/android-library-dev'
      && github.event_name != 'schedule'
      && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-ui-tests'))
      && (!github.event.label || github.event.label.name == 'run-ui-tests' || github.event.label.name == 'visual-change-accepted')
    runs-on:
      labels: airship-large-runner
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
      pull-requests: write
      pages: read
    # Serialised with the docs deploy, which pushes to the same Pages branch.
    concurrency:
      group: pages
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          # The merge commit's parent is what promotion checks the PR run against.
          fetch-depth: 2

      - name: Cache Thomas layouts
        uses: actions/cache@v4
        with:
          path: |
            devapp/src/main/assets/sample_layouts/Scenes
            devapp/src/main/assets/sample_layouts/.layouts.version
          key: thomas-layouts-${{ hashFiles('layouts.version') }}

      # ios-library-dev mints a token from the org's repo-reader GitHub App here,
      # but that org secret is not shared with this repo, so we authenticate with
      # a read-only deploy key on thomas-layouts instead.
      - name: Setup layouts deploy key
        env:
          LAYOUTS_DEPLOY_KEY: ${{ secrets.THOMAS_LAYOUTS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$LAYOUTS_DEPLOY_KEY" > ~/.ssh/thomas_layouts_deploy
          chmod 600 ~/.ssh/thomas_layouts_deploy

      - name: Fetch Thomas layouts
        env:
          LAYOUTS_REPO_URL: git@github.com:urbanairship/thomas-layouts.git
          GIT_SSH_COMMAND: ssh -i $HOME/.ssh/thomas_layouts_deploy -o StrictHostKeyChecking=accept-new
        run: bash ./scripts/fetch-layouts.sh

      - name: Setup Java Version
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle ; cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      # The pin lives in config.json, so read it rather than repeating it here: a version
      # bump there changes the key and the stale binary is never reused. `doctor` downloads
      # and checksum-verifies odiff on a miss, so a cold cache costs one release asset.
      - name: odiff version
        id: odiff
        run: echo "version=$(jq -r .odiff.version uitests/config.json)" >> "$GITHUB_OUTPUT"

      - name: Cache odiff
        uses: actions/cache@v4
        with:
          path: uitests/build/bin
          key: odiff-${{ runner.os }}-${{ runner.arch }}-${{ steps.odiff.outputs.version }}

      # After the fetch, so the fixture check has something to look at.
      - name: Doctor
        run: bash ./uitests/bin/uitest doctor

      - name: Baseline label
        id: label
        run: echo "label=robolectric-$(jq -r .robolectric.sdk uitests/config.json)" >> "$GITHUB_OUTPUT"

      # The PR's head, not `git rev-parse HEAD`: on a `pull_request` event the checkout sits
      # on the merge commit GitHub synthesised, a sha that appears nowhere in the PR. It names
      # the run in the report and in its comment, and names the report's directory.
      - name: Head commit
        id: head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "short=${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Promote the merged PR's screenshots
        if: github.event_name == 'push'
        id: promote
        run: |
          if bash ./uitests/bin/uitest promote-baselines "${{ github.sha }}"; then
            echo "promoted=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing to promote; capturing in full."
          fi

      - name: Capture screenshots
        if: steps.promote.outputs.promoted != 'true'
        env:
          # Recorded in provenance.json so a merge can tell whether these screenshots
          # were taken against the base as it was at merge time.
          UITEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          UITEST_COMMIT: ${{ steps.head.outputs.sha }}
          UITEST_BASELINE_BRANCH: ${{ github.base_ref }}
          # A merge or dispatch diffs only for the record: the run exists to mint
          # baselines, and a failing diff there would keep the branch on stale ones.
          UITEST_DIFF_REPORT_ONLY: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'visual-change-accepted')) && '1' || '' }}
        run: ./gradlew uitestRun --console=plain

      - name: Upload report, screenshots and diffs
        if: github.event_name == 'pull_request' && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-report
          path: |
            uitests/build/report
            uitests/build/shots
            uitests/build/diffs
          include-hidden-files: true
          retention-days: 14

      - name: Publish report to Pages
        if: github.event_name == 'pull_request' && !cancelled() && github.event.pull_request.head.repo.full_name == github.repository
        id: publish
        env:
          SHORT_SHA: ${{ steps.head.outputs.short }}
        run: |
          if [ -f uitests/build/report/index.html ]; then
            gh auth setup-git
            bash ./uitests/bin/uitest publish-report "${{ github.event.pull_request.number }}" "$SHORT_SHA"
            PAGES_URL=$(gh api "repos/${{ github.repository }}/pages" --jq .html_url)
            echo "url=${PAGES_URL%/}/ui-tests/pr-${{ github.event.pull_request.number }}/$SHORT_SHA/" >> "$GITHUB_OUTPUT"
          fi

      # A comment per run, rather than one comment rewritten in place: which push changed
      # which screenshot is the thing a reviewer is trying to read off the PR. The marker
      # carries the run and commit so the previous ones can be found and collapsed.
      - name: Comment on PR
        if: github.event_name == 'pull_request' && !cancelled() && github.event.pull_request.head.repo.full_name == github.repository
        env:
          SHORT_SHA: ${{ steps.head.outputs.short }}
        run: |
          MARKER="<!-- thomas-screenshot-tests run=${{ github.run_id }} sha=$SHORT_SHA -->"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          REPORT_URL="${{ steps.publish.outputs.url }}"
          SUMMARY=uitests/build/report/summary.md
          # summary.md's last line is the commit/time footer; it stays last in the comment.
          render() { sed -e "s#__REPORT_URL__#$REPORT_URL#g" -e "s#__RUN_URL__#$RUN_URL#g" "$SUMMARY"; }
          if [ ! -f "$SUMMARY" ]; then
            BODY="**Thomas screenshot tests:** the run produced no report ($SHORT_SHA), see the [run log]($RUN_URL)."
          else
            if [ -n "$REPORT_URL" ]; then
              BODY=$(render | sed '$d')
            else
              # No published report to link into: keep the summary line, point at the artifact.
              BODY=$(head -1 "$SUMMARY" | sed "s|\[Report\](__REPORT_URL__[^)]*)|[Report]($RUN_URL#artifacts) (artifact)|")
            fi
            if grep -q "need a look" <<<"$BODY"; then
              BODY="$BODY"$'\n\n'"Intentional? Add the \`visual-change-accepted\` label."
            fi
            BODY="$BODY"$'\n\n'"$(render | tail -1)"
          fi
          BODY="$MARKER"$'\n'"$BODY"
          PR=${{ github.event.pull_request.number }}
          # Listed before posting, so this run's own comment is not in it.
          PREVIOUS=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- thomas-screenshot-tests"))) | .node_id')
          gh pr comment "$PR" --repo "${{ github.repository }}" --body "$BODY"
          # Collapse the earlier runs: the sequence stays in the timeline, only the newest is expanded.
          for node in $PREVIOUS; do
            gh api graphql -f query='mutation($id: ID!) { minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) { minimizedComment { isMinimized } } }' \
              -f id="$node" >/dev/null || echo "could not collapse comment $node"
          done

      # --- merges, dispatch: these screenshots are the branch's new baselines ---
      # No status function in the `if`, so a failed capture skips this step: only a
      # complete run may become a baseline.
      - name: Publish baselines
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: baselines-${{ steps.label.outputs.label }}
          path: uitests/build/shots
          include-hidden-files: true
          retention-days: 90
