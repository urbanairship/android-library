name: CI

on: [pull_request, workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on:
      labels: airship-large-runner
    timeout-minutes: 25
    name: CI

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Cache Thomas layouts
        uses: actions/cache@v4
        with:
          path: |
            devapp/src/main/assets/sample_layouts/Scenes
            devapp/src/main/assets/sample_layouts/.layouts.version
          key: thomas-layouts-${{ hashFiles('layouts.version') }}

      # ios-library-dev mints a token from the org's repo-reader GitHub App here,
      # but that org secret is not shared with this repo, so we authenticate with
      # a read-only deploy key on thomas-layouts instead.
      - name: Setup layouts deploy key
        env:
          LAYOUTS_DEPLOY_KEY: ${{ secrets.THOMAS_LAYOUTS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$LAYOUTS_DEPLOY_KEY" > ~/.ssh/thomas_layouts_deploy
          chmod 600 ~/.ssh/thomas_layouts_deploy

      - name: Fetch Thomas layouts
        env:
          LAYOUTS_REPO_URL: git@github.com:urbanairship/thomas-layouts.git
          GIT_SSH_COMMAND: ssh -i $HOME/.ssh/thomas_layouts_deploy -o StrictHostKeyChecking=accept-new
        run: bash ./scripts/fetch-layouts.sh

      - name: Setup Java Version
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle ; cp .github/ci-gradle.properties ~/.gradle/gradle.properties
        
      - name: Test
        run: bash ./gradlew spotlessCheck releaseApiCheck testDebugUnitTest --stacktrace --fail-fast

      - name: Publish unit test reports
        if: always()
        uses: mikepenz/action-junit-report@a6502270b81b22b7cf745720fcf00edf7d31dc04
        with:
          check_name: 'Test report'
          github_token: ${{ github.token }}
          report_paths: '**/build/test-results/**/TEST-*.xml'
          fail_on_failure: true
