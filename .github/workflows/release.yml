name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

jobs:
  release:
    if: github.repository == 'urbanairship/android-library'
    runs-on:
      labels: airship-large-runner
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: Get the version
        id: get_version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/}"
          # Defense in depth only - the primary control is that VERSION is never
          # interpolated into a shell script body. The tag filter's trailing "*" accepts
          # arbitrary suffixes, so fail closed on anything outside the charset our real
          # tags use (20.12.0, 18.0.0-alpha, 17.0.0-beta, 7.3.0-dp1, 6.0.0-ea1).
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.-]*$'; then
            echo "::error::Refusing to release: tag is not a valid version string"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Get the release notes
        id: get_release_notes
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          set -euo pipefail

          # Pass the version to awk as a variable rather than splicing it into the
          # program text, and anchor the heading match so 20.1.0 can't match 20.1.01.
          NOTES=$(awk -v ver="$VERSION" '
            $0 ~ "^## Version " ver "($|[ ]-)" {flag=1; next}
            $0 ~ "^## Version " {flag=0}
            flag
          ' CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            echo "::error::Could not find notes for Version $VERSION in CHANGELOG.md"
            exit 1
          fi

          delimiter="$(openssl rand -hex 8)"
          {
            echo "NOTES<<${delimiter}"
            echo "$NOTES"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Java Version
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle ; cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Verify Version
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          set -euo pipefail
          ACTUAL_VERSION=$(./gradlew -q getVersion)
          if [[ "$ACTUAL_VERSION" != "$VERSION" ]]; then
            echo "::error::Version mismatch: tag '$VERSION' does not match Gradle version '$ACTUAL_VERSION'"
            exit 1
          fi

      - name: Build
        run: ./gradlew assembleRelease packageDocs --stacktrace

      - name: Publish to Maven Central
        env:
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishAggregationToCentralPortal --stacktrace

      - name: Github Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          release_name: ${{ steps.get_version.outputs.VERSION }}
          body: ${{ steps.get_release_notes.outputs.NOTES }}
          draft: false
          prerelease: false
          
      - name: Upload docs package
        uses: actions/upload-artifact@v4
        with:
          name: packaged-docs-${{ steps.get_version.outputs.VERSION }}
          retention-days: 1
          path: |
            build/docs/${{ steps.get_version.outputs.VERSION }}-kdoc.tar.gz
          # The publish-docs workflow will build the docs if we
          # somehow fail to upload them in this step.
          if-no-files-found: warn

  deploy-to-github-pages:
    if: github.repository == 'urbanairship/android-library'
    needs: release
    uses: ./.github/workflows/publish-docs.yml
    with:
      version: ${{ needs.release.outputs.version }}
