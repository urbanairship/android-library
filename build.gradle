import java.time.temporal.ChronoUnit

buildscript {
    ext {
        // Airship Version - major.minor.patch
        airshipVersion = '21.0.2'

        // Airship Version Qualifier beta, release, etc...
        // airshipVersionQualifier = "alpha"

        // Android SDK Versions
        minSdkVersion = 26
        compileSdkVersion = 36
        targetSdkVersion = 36

        // Looking for dependency versions?
        // See: ./gradle/libs.versions.toml
    }

    dependencies {
        classpath "com.android.tools.build:gradle:${libs.versions.androidGradlePlugin.get()}"
        classpath "com.google.gms:google-services:${libs.versions.googleServicesPlugin.get()}"
        classpath "org.jetbrains.kotlin:kotlin-allopen:${libs.versions.kotlin.get()}"
    }
}

plugins {
    id 'org.jetbrains.dokka'

    id("com.gradleup.nmcp.aggregation")
    alias(libs.plugins.benmanes.versions)
    alias(libs.plugins.spotless)
}

def mavenUser = System.getenv("MAVEN_USER") ?: findProperty("maven.user") ?: ""
def mavenPassword = System.getenv("MAVEN_PASSWORD") ?: findProperty("maven.password") ?: ""

nmcpAggregation {
    centralPortal {
        username = mavenUser
        password = mavenPassword

        publishingType = "AUTOMATIC"
        validationTimeout = Duration.of(30, ChronoUnit.MINUTES)
    }
}

dependencies {
    allprojects {
        nmcpAggregation(project(path))
    }
}

dependencies {
    dokkaPlugin(libs.dokka.android)

    dokka(project(":urbanairship-adm"))
    dokka(project(":urbanairship-automation"))
    dokka(project(":urbanairship-automation-compose"))
    dokka(project(":urbanairship-core"))
    dokka(project(":urbanairship-fcm"))
    dokka(project(":urbanairship-feature-flag"))
    dokka(project(":urbanairship-hms"))
    dokka(project(":urbanairship-live-update"))
    dokka(project(":urbanairship-preference-center"))
    dokka(project(":urbanairship-preference-center-compose"))
    dokka(project(":urbanairship-preference-center-core"))
    dokka(project(':urbanairship-message-center'))
    dokka(project(':urbanairship-message-center-compose'))
    dokka(project(':urbanairship-message-center-core'))
}

dokka {
    moduleName.set("Airship Android SDK")

    dokkaPublications.html {
        suppressInheritedMembers.set(false)
        outputDirectory.set(rootProject.layout.buildDirectory.dir("docs/kdoc"))
    }

    pluginsConfiguration.html {
        customAssets.from("$rootDir/docs/dokka/logo-icon.svg")
        footerMessage.set("©${Year.now().value} Airship")
    }
}

tasks.register("packageKDoc", Tar) {
    dependsOn("dokkaGenerate")
    group = JavaBasePlugin.DOCUMENTATION_GROUP
    description = "Generates documentation in KDoc format"

    into("./") {
        from("build/docs/kdoc")
    }

    archiveFileName.set("${rootProject.property("airshipVersion")}-kdoc.tar.gz")
    destinationDirectory.set(file("build/docs"))
    archiveExtension.set("tar.gz")
    compression = Compression.GZIP
}

tasks.register("packageDocs") {
    dependsOn("packageKDoc")
    group = JavaBasePlugin.DOCUMENTATION_GROUP
    description = "Generate KDoc archives for release"
}

tasks.register('getVersion') {
    doLast {
        def version = airshipVersion
        if (project.hasProperty("airshipVersionQualifier")) {
            version += "-" + airshipVersionQualifier
        }
        println version
    }
}

// TODO: need to update ktlint for compatibility with kotlin 1.9, but they've changed
// how to configure it. Disabling ktlint for now, and we'll revisit later.
spotless {
    // Targets are scoped to module source roots rather than '**', so generated output under
    // */build, nested checkouts such as git worktrees, and .idea templates are never scanned.
    // This assumes modules stay top-level; a nested module would need its own glob here.
    java {
        target '*/src/**/*.java'

        trimTrailingWhitespace()
        leadingTabsToSpaces()
        endWithNewline()
    }
    def ktlintVersion = libs.versions.ktlint.get()
    def ktlintUserData = [
        'android': 'true',
        'max_line_length': 'off',
        // Match Android Kotlin style guide import order.
        // https://developer.android.com/kotlin/style-guide
        'kotlin_imports_layout': 'ascii',
        // Disable 'indent' to avoid overly aggressive wrapping of function parameters.
        'disabled_rules': 'indent'
    ]
    kotlin {
        target '*/src/**/*.kt'
        // buildSrc sources are handled by the kotlinGradle block below.
        targetExclude 'buildSrc/**'

        //ktlint(ktlintVersion).userData(ktlintUserData)

        trimTrailingWhitespace()
        leadingTabsToSpaces()
        endWithNewline()
    }
    kotlinGradle {
        target 'buildSrc/**/*.kts', 'buildSrc/**/*.kt'
        targetExclude 'buildSrc/build/**'

        //ktlint(ktlintVersion).userData(ktlintUserData)

        trimTrailingWhitespace()
        leadingTabsToSpaces()
        endWithNewline()
    }
}

def isNonStable = { String version ->
    def stableKeyword = ['RELEASE', 'FINAL', 'GA'].any { it -> version.toUpperCase().contains(it) }
    def regex = /^[0-9,.v-]+(-r)?$/
    return !stableKeyword && !(version ==~ regex)
}

tasks.named("dependencyUpdates").configure {
    it.rejectVersionIf {
        isNonStable(it.candidate.version)
    }
}

// Thomas screenshot tests. Gradle owns capture (Roborazzi under Robolectric); the
// uitests shell harness owns everything after it. The harness never calls Gradle
// back, so these are plain `bash` execs -- a nested ./gradlew would contend with
// this build for the daemon and the build lock.
def uitestExec = { String taskName, String summary, List<String> command ->
    tasks.register(taskName, Exec) {
        group = 'verification'
        description = summary
        workingDir rootDir
        commandLine(['bash', './uitests/bin/uitest'] + command)
    }
}

// CI-facing variants, whose subcommand argument comes from a project property.
def uitestArgExec = { String taskName, String summary, String subcommand, String propertyName ->
    tasks.register(taskName, Exec) {
        group = 'verification'
        description = summary
        workingDir rootDir
        def value = providers.gradleProperty(propertyName)
        commandLine 'bash', './uitests/bin/uitest', subcommand
        doFirst {
            if (!value.present) {
                throw new GradleException("$taskName requires -P$propertyName=<value>")
            }
            args value.get()
        }
    }
}

uitestExec('uitestDoctor', 'Verifies the screenshot test toolchain and that the Scene fixtures are present.', ['doctor'])
uitestExec('uitestFinish', 'Records provenance for a capture, then pulls baselines, diffs and reports.', ['finish'])
uitestExec('uitestSetBaseline', 'Promotes the last capture into the local baseline cache.', ['set-baseline'])
uitestExec('uitestBaselinePull', 'Downloads the newest baselines artifact for the base branch.', ['baseline-pull'])
uitestExec('uitestDiff', 'Pixel-diffs the last capture against the pulled baselines.', ['diff'])
uitestExec('uitestReport', 'Builds the screenshot report and PR summary from the last diff.', ['report'])
uitestExec('uitestPruneReports', 'Removes published reports for pull requests that are no longer open.', ['prune-reports'])

uitestArgExec('uitestPublishReport', 'Publishes the last report to the private Pages site (-Ppr=<number>).', 'publish-report', 'pr')
uitestArgExec('uitestPromoteBaselines', "Reuses a merged pull request's screenshots as the new baselines (-Psha=<merge sha>).", 'promote-baselines', 'sha')

// Capture has to finish before `uitest finish` runs, and a failed capture must never
// be blessed: as a `finalizedBy` the finish step would still run and write the
// `.complete` marker over a partial capture, so the order is a dependency instead.
tasks.named('uitestFinish').configure {
    dependsOn ':urbanairship-layout:testDebugUnitTest'
}

tasks.register('uitestRun') {
    group = 'verification'
    description = 'Captures the Thomas screenshots, then diffs them and builds the report.'
    dependsOn ':urbanairship-layout:testDebugUnitTest', 'uitestFinish'
}
