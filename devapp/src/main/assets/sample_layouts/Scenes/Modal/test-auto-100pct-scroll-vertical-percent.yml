---
# Tests: Vertical scroll with height-percent children.
# Each block's height is a % of the scroll viewport height.
#
# With the current measuredFrameSize fill approach, the scroll content's
# frame max is also bounded to viewport height. So 100% + 50% = 150% of
# content will NOT be 150% scrollable — the blocks compress to fit.
#
# INTERESTING CASE: blue (100%) + red (50%) should ideally produce a
# scrollable 150%-tall content area, but currently both fit in one screen.
# This is the known limitation of using height for both the % reference
# and the frame max constraint.
#
# PASS criteria (current behavior):
#   - Blue block fills ~2/3 of visible area
#   - Red block fills ~1/3 of visible area
#   - No scrolling needed (total = viewport)
#
# FUTURE: if a separate referenceHeight field is added, blue should fill
#   one full screen and red should require scrolling to see.
version: 1
presentation:
  type: modal
  dismiss_on_touch_outside: true
  default_placement:
    size:
      width: 80%
      height: 80%
    position:
      horizontal: center
      vertical: center
    shade_color:
      default:
        hex: "#000000"
        alpha: 0.4
view:
  type: scroll_layout
  direction: vertical
  view:
    type: linear_layout
    direction: vertical
    items:

    # 100% of viewport height — should fill one full screen
    - size:
        width: 100%
        height: 100%
      view:
        type: container
        background_color:
          default:
            hex: "#4444FF"
            alpha: 0.5
        items:
        - position:
            horizontal: center
            vertical: center
          size:
            width: auto
            height: auto
          view:
            type: label
            text: "100% height\n(full viewport)"
            text_appearance:
              font_size: 20
              color:
                default:
                  hex: "#FFFFFF"
                  alpha: 1
              alignment: center
              styles:
              - bold
              font_families:
              - sans-serif

    # 50% of viewport height — should require scrolling to reach
    - size:
        width: 100%
        height: 50%
      view:
        type: container
        background_color:
          default:
            hex: "#FF4444"
            alpha: 0.5
        items:
        - position:
            horizontal: center
            vertical: center
          size:
            width: auto
            height: auto
          view:
            type: label
            text: "50% height\n(half viewport)\nshould need scroll to reach"
            text_appearance:
              font_size: 20
              color:
                default:
                  hex: "#FFFFFF"
                  alpha: 1
              alignment: center
              styles:
              - bold
              font_families:
              - sans-serif

    # 25% of viewport height
    - size:
        width: 100%
        height: 25%
      view:
        type: container
        background_color:
          default:
            hex: "#44AA44"
            alpha: 0.5
        items:
        - position:
            horizontal: center
            vertical: center
          size:
            width: auto
            height: auto
          view:
            type: label
            text: "25% height"
            text_appearance:
              font_size: 20
              color:
                default:
                  hex: "#FFFFFF"
                  alpha: 1
              alignment: center
              styles:
              - bold
              font_families:
              - sans-serif
