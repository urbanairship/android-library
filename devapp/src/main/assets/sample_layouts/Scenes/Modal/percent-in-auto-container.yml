# Percent-sized items inside an auto-sized container.
#
# The gray container is `height: auto`, so it sizes to its tallest item — the 200dp red label.
# The blue box is `50% x 50%`, which should resolve against that settled size: 100dp tall and
# half the container's width, pinned top-start. Before percent-in-auto was supported, the blue
# box either collapsed to nothing or stretched to the full available space.
version: 1
presentation:
  dismiss_on_touch_outside: true
  type: modal
  default_placement:
    size:
      width: 90%
      height: 70%
    shade_color:
      default:
        hex: '#000000'
        alpha: 0.7
view:
  type: container
  background_color:
    default:
      hex: '#ffffff'
      alpha: 1
  items:
    - position:
        horizontal: center
        vertical: top
      size:
        width: 100%
        height: 100%
      view:
        type: linear_layout
        direction: vertical
        items:
          - size:
              width: 100%
              height: auto
            margin:
              top: 16
              start: 16
              end: 16
            view:
              type: container
              background_color:
                default:
                  hex: '#dddddd'
                  alpha: 1
              items:
                # Fixed 200dp item — this is what the auto container sizes itself to.
                - position:
                    horizontal: center
                    vertical: center
                  size:
                    width: 100%
                    height: 200
                  view:
                    type: label
                    text: 'auto container (200dp tall)'
                    background_color:
                      default:
                        hex: '#ff5555'
                        alpha: 1
                    text_appearance:
                      color:
                        default:
                          hex: '#000000'
                          alpha: 1
                      alignment: center
                      font_size: 14
                # Should measure 100dp tall (50% of 200) and half the container's width.
                - position:
                    horizontal: start
                    vertical: top
                  size:
                    width: 50%
                    height: 50%
                  view:
                    type: label
                    text: '50% x 50%'
                    background_color:
                      default:
                        hex: '#5588ff'
                        alpha: 1
                    text_appearance:
                      color:
                        default:
                          hex: '#ffffff'
                          alpha: 1
                      alignment: center
                      font_size: 14
          - size:
              width: 100%
              height: auto
            margin:
              top: 16
              start: 16
              end: 16
            view:
              type: label
              text: 'Blue box should be exactly half the height and width of the gray block above.'
              text_appearance:
                color:
                  default:
                    hex: '#000000'
                    alpha: 1
                alignment: center
                font_size: 12
