# Percent-sized children under auto-sized parents — every case worth watching, one per page.
#
# Swipe through. Each page states what a pass looks like; the two that break in opposite
# directions are 3 (the stack must SOLVE for its base) and 7 (it must BORROW one and not
# solve). Check those together — fixing one has repeatedly broken the other.
#
# `ratio-percent` combines aspect_ratio with percent, which nothing else in the corpus
# does. Both platforms now agree: the percent sets the width, the ratio derives the height.
#
# `overflow-in-auto`, `overflow-nested`, `hstack-overflow` and `scroll-percent-spacer` came
# out of the infinite-height crash. `overflow-in-auto` is a regression guard — that exact
# shape used to grow ~3x per pass until SwiftUI trapped, so it must simply sit still.
# `overflow-nested` is the case neither platform gets right (neither can tell an inherited
# bound apart from its own height, so the inner stack gives up) — they are at least wrong
# the same way. `scroll-percent-spacer` is a shape that was inert before percent started
# resolving on a scroll axis, which existing scenes may be relying on. `hstack-overflow` is
# the width-axis twin of `stack-overflow` — the solver treats both axes the same, but only
# height was ever exercised.
#
# Page 17 is the odd one out: no percent anywhere. It is here because the overflow branch
# that the percent work leans on can be reached without any percent at all, by a stack
# handing a child the whole parent length instead of what its siblings left.
