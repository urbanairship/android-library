---
# Tests: Container (ZStack) with auto parent size + 100% child size.
#
# The red background is 100% x 100% of the auto-sized container.
# The label in the center is auto-sized and determines the container's natural size.
#
# PASS: red rectangle tightly wraps the label text.
# FAIL: red rectangle is invisible (zero size) — 100% of nil = nil.
version: 1
presentation:
  type: modal
  dismiss_on_touch_outside: true
  default_placement:
    size:
      width: auto
      height: auto
    position:
      horizontal: center
      vertical: center
    shade_color:
      default:
        hex: "#000000"
        alpha: 0.4
view:
  type: container
  items:
  - position:
      horizontal: center
      vertical: center
    size:
      width: 100%
      height: 100%
    view:
      type: linear_layout
      direction: vertical
      background_color:
        default:
          hex: "#FF4444"
          alpha: 0.6
      items: []
  - position:
      horizontal: center
      vertical: center
    size:
      width: auto
      height: auto
    margin:
      top: 24
      bottom: 24
      start: 24
      end: 24
    view:
      type: label
      text: "Container: auto parent\n100% child fills this label"
      text_appearance:
        font_size: 18
        color:
          default:
            hex: "#000000"
            alpha: 1
        alignment: center
        styles: []
        font_families:
        - sans-serif
