# Percent-sized children under auto-sized parents — every case worth watching, one per page.
#
# Swipe through. Each page states what a pass looks like; the two that break in opposite
# directions are 3 (the stack must SOLVE for its base) and 7 (it must BORROW one and not
# solve). Check those together — fixing one has repeatedly broken the other.
#
# Page 10 has no known-good answer: nothing in the corpus combines aspect_ratio with
# percent, so it is there to compare iOS against Android, not to pass.
version: 1
presentation:
  type: modal
  dismiss_on_touch_outside: true
  default_placement:
    size:
      width: 92%
      height: 92%
    position:
      horizontal: center
      vertical: center
    shade_color:
      default:
        hex: "#000000"
        alpha: 0.6
view:
  type: pager_controller
  identifier: percent-in-auto-pager
  view:
    type: container
    items:
    - size:
        width: 100%
        height: 100%
      view:
        type: pager
        disable_swipe: false
        items:
        - identifier: container-solve
          view:
            type: container
            items:
            - size:
                width: 100%
                height: 100%
              view:
                type: linear_layout
                direction: vertical
                items:
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: container-solve
                    text_appearance:
                      color:
                        default:
                          hex: "#888888"
                          alpha: 1
                      alignment: center
                      font_size: 11
                  margin:
                    bottom: 2
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: 'Container: auto + percent'
                    text_appearance:
                      color:
                        default:
                          hex: "#000000"
                          alpha: 1
                      alignment: center
                      font_size: 15
                  margin:
                    bottom: 12
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: container
                    items:
                    - size:
                        width: 100%
                        height: 200
                      view:
                        type: label
                        text: 200dp fixed
                        text_appearance:
                          color:
                            default:
                              hex: "#000000"
                              alpha: 1
                          alignment: center
                          font_size: 14
                        background_color:
                          default:
                            hex: "#ff5555"
                            alpha: 1
                      position:
                        horizontal: center
                        vertical: center
                    - size:
                        width: 50%
                        height: 50%
                      view:
                        type: label
                        text: 50% x 50%
                        text_appearance:
                          color:
                            default:
                              hex: "#ffffff"
                              alpha: 1
                          alignment: center
                          font_size: 14
                        background_color:
                          default:
                            hex: "#5588ff"
                            alpha: 1
                      position:
                        horizontal: start
                        vertical: top
                    background_color:
                      default:
                        hex: "#dddddd"
                        alpha: 1
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: Blue is half the height and half the width of the red block.
                    text_appearance:
                      color:
                        default:
                          hex: "#444444"
                          alpha: 1
                      alignment: center
                      font_size: 12
                  margin:
                    top: 12
              margin:
                top: 16
                bottom: 16
                start: 16
                end: 16
              position:
                horizontal: center
                vertical: center
        - identifier: container-degenerate
