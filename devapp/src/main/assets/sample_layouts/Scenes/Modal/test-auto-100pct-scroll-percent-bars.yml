---
# Tests: Scroll cross-axis percent sizing.
# The scroll has auto width (from auto modal). The content label drives the natural
# width. Each colored bar is a different % of that scroll viewport width.
#
# PASS: bars form a staircase — each visibly wider than the previous.
#       100% bar fills edge-to-edge, 25% bar is a quarter of that.
# FAIL: all bars invisible or the same wrong size.
version: 1
presentation:
  type: modal
  dismiss_on_touch_outside: true
  default_placement:
    size:
      width: auto
      height: auto
      max_height: 85%
    position:
      horizontal: center
      vertical: center
    shade_color:
      default:
        hex: "#000000"
        alpha: 0.4
view:
  type: scroll_layout
  direction: vertical
  view:
    type: linear_layout
    direction: vertical
    background_color:
      default:
        hex: "#F5F5F5"
        alpha: 1
    items:

    - size:
        width: auto
        height: auto
      margin:
        top: 16
        bottom: 12
        start: 16
        end: 16
      view:
        type: label
        text: "Scroll % width bars (auto scroll width)"
        text_appearance:
          font_size: 16
          color:
            default:
              hex: "#000000"
              alpha: 1
          alignment: center
          styles:
          - bold
          font_families:
          - sans-serif

    # 25% bar
    - size:
        width: 100%
        height: auto
      margin:
        top: 4
        bottom: 0
        start: 0
        end: 0
      view:
        type: container
        items:
        - position:
            horizontal: start
            vertical: center
          size:
            width: 25%
            height: 40
          view:
            type: linear_layout
            direction: horizontal
            background_color:
              default:
                hex: "#FF4444"
                alpha: 1
            items: []
        - position:
            horizontal: start
            vertical: center
          size:
            width: auto
            height: auto
          margin:
            start: 4
          view:
            type: label
            text: "25%"
            text_appearance:
              font_size: 13
              color:
                default:
                  hex: "#555555"
                  alpha: 1
              alignment: start
              styles: []
              font_families:
              - sans-serif

    # 50% bar
