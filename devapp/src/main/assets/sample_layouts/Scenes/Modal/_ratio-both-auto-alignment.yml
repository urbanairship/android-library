# aspect_ratio + auto/auto and the stack's own alignment.
#
# Companion to page 7 (ratio-both-auto-rigid) of _percent-in-auto-adversarial.yml. That page
# proves a both-auto ratio item gets a real box even when its content is rigid; this one asks
# where the content sits inside that box.
#
# iOS #3947 fixes the rigid case by filling before .aspectRatio(.fit) runs, and the frame it
# adds to do that is .center. In the both-auto case it is the only frame that positions
# anything: the frame that carries the stack's own alignment (.top for a vertical stack,
# .leading for a horizontal one) has every dimension nil there, so it never applies. The
# alignment is dropped rather than overridden — nothing in the code says .center is wanted.
#
# Each page renders the same content twice, in two boxes of the same size:
#
#   CONTROL - one axis declared, so the ratio derives the other and both are concrete. The
#             alignment frame has real dimensions and survives.
#   TEST    - both axes auto, which is the case #3947 changed.
#
# The two boxes should be the same size and the green band should sit in the same place in
# both. If it moves, the alignment was dropped.
version: 1
presentation:
  type: modal
  dismiss_on_touch_outside: true
  default_placement:
    size:
      width: 92%
      height: 92%
    position:
      horizontal: center
      vertical: center
    shade_color:
      default:
        hex: "#000000"
        alpha: 0.6
view:
  type: pager_controller
  identifier: ratio-alignment-pager
  view:
    type: container
    background_color:
      default:
        hex: "#ffffff"
        alpha: 1
    items:
    - size:
        width: 100%
        height: 100%
      position:
        horizontal: center
        vertical: center
      view:
        type: pager
        disable_swipe: false
        items:

        # ------------------------------------------------------------------ 1
        # Vertical stack. A vertical linear_layout lays its children from the top, and iOS
        # says so explicitly: `.constraints(self.constraints, alignment: .top)`. With both
        # axes auto the fill frame added for the ratio is the one that positions the content,
        # and it centers.
        - identifier: ratio-auto-auto-vertical
          view:
            type: container
            items:
            - size:
                width: 100%
                height: 100%
              view:
                type: linear_layout
                direction: vertical
                items:
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: 1 - ratio-auto-auto-vertical
                    text_appearance:
                      color:
                        default:
                          hex: "#888888"
                          alpha: 1
                      alignment: center
                      font_size: 11
                  margin:
                    bottom: 2
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: aspect_ratio + auto/auto, vertical stack
                    text_appearance:
                      color:
                        default:
                          hex: "#000000"
                          alpha: 1
                      alignment: center
                      font_size: 15
                  margin:
                    bottom: 12

                # CONTROL: 100% / auto. The ratio derives the height, so both axes are
                # concrete by the time the stack renders and the .top alignment applies.
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: 'CONTROL - 100% / auto + aspect_ratio 3.0'
                    text_appearance:
                      color:
                        default:
                          hex: "#000000"
                          alpha: 1
                      alignment: center
                      font_size: 14
                  margin:
                    bottom: 2
                - size:
                    width: 100%
                    height: auto
                    aspect_ratio: 3.0
                  view:
                    type: linear_layout
                    direction: vertical
                    background_color:
                      default:
                        hex: "#eeeeee"
                        alpha: 1
                    items:
                    - size:
                        width: 140
                        height: 28
                      view:
                        type: label
                        text: first child
                        text_appearance:
                          color:
                            default:
                              hex: "#ffffff"
                              alpha: 1
                          alignment: center
                          font_size: 13
                        background_color:
                          default:
                            hex: "#33aa55"
                            alpha: 1
                  margin:
                    bottom: 12

                # TEST: auto / auto. Nothing declares a length, so the ratio box comes from
                # the fill frame #3947 adds — and that frame is .center.
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: 'TEST - auto / auto + aspect_ratio 3.0'
                    text_appearance:
                      color:
                        default:
                          hex: "#000000"
                          alpha: 1
                      alignment: center
                      font_size: 14
                  margin:
                    bottom: 2
                - size:
                    width: auto
                    height: auto
                    aspect_ratio: 3.0
                  view:
                    type: linear_layout
                    direction: vertical
                    background_color:
                      default:
                        hex: "#eeeeee"
                        alpha: 1
                    items:
                    - size:
                        width: 140
                        height: 28
                      view:
                        type: label
                        text: first child
                        text_appearance:
                          color:
                            default:
                              hex: "#ffffff"
                              alpha: 1
                          alignment: center
                          font_size: 13
                        background_color:
                          default:
                            hex: "#33aa55"
                            alpha: 1

                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: "Both green bands should sit at the TOP of their grey box.\n\nFAIL:
                      the TEST band is centered.\n\n(Ignore any small size difference between
                      the boxes.)"
                    text_appearance:
                      color:
                        default:
                          hex: "#000000"
                          alpha: 1
                      alignment: center
                      font_size: 15
                  margin:
                    top: 12
              margin:
                top: 16
                bottom: 16
                start: 16
                end: 16
              position:
                horizontal: center
                vertical: center

        # ------------------------------------------------------------------ 2
        # Horizontal stack, same shape. A horizontal linear_layout lays its children from the
        # start edge, and iOS says `.constraints(constraints, alignment: .leading)`. The band
        # is full height and narrow here so its horizontal placement is what reads.
        - identifier: ratio-auto-auto-horizontal
          view:
            type: container
            items:
            - size:
                width: 100%
                height: 100%
              view:
                type: linear_layout
                direction: vertical
                items:
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: 2 - ratio-auto-auto-horizontal
                    text_appearance:
                      color:
                        default:
                          hex: "#888888"
                          alpha: 1
                      alignment: center
                      font_size: 11
                  margin:
                    bottom: 2
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: aspect_ratio + auto/auto, horizontal stack
                    text_appearance:
                      color:
                        default:
                          hex: "#000000"
                          alpha: 1
                      alignment: center
                      font_size: 15
                  margin:
                    bottom: 12

                # CONTROL: 100% / auto, so both axes are concrete and .leading applies.
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: 'CONTROL - 100% / auto + aspect_ratio 3.0'
                    text_appearance:
                      color:
                        default:
                          hex: "#000000"
                          alpha: 1
                      alignment: center
                      font_size: 14
                  margin:
                    bottom: 2
                - size:
                    width: 100%
                    height: auto
                    aspect_ratio: 3.0
                  view:
                    type: linear_layout
                    direction: horizontal
                    background_color:
                      default:
                        hex: "#eeeeee"
                        alpha: 1
                    items:
                    - size:
                        width: 140
                        height: 28
                      view:
                        type: label
                        text: first
                        text_appearance:
                          color:
                            default:
                              hex: "#ffffff"
                              alpha: 1
                          alignment: center
                          font_size: 13
                        background_color:
                          default:
                            hex: "#5588ff"
                            alpha: 1
                  margin:
                    bottom: 12

                # TEST: auto / auto.
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: 'TEST - auto / auto + aspect_ratio 3.0'
                    text_appearance:
                      color:
                        default:
                          hex: "#000000"
                          alpha: 1
                      alignment: center
                      font_size: 14
                  margin:
                    bottom: 2
                - size:
                    width: auto
                    height: auto
                    aspect_ratio: 3.0
                  view:
                    type: linear_layout
                    direction: horizontal
                    background_color:
                      default:
                        hex: "#eeeeee"
                        alpha: 1
                    items:
                    - size:
                        width: 140
                        height: 28
                      view:
                        type: label
                        text: first
                        text_appearance:
                          color:
                            default:
                              hex: "#ffffff"
                              alpha: 1
                          alignment: center
                          font_size: 13
                        background_color:
                          default:
                            hex: "#5588ff"
                            alpha: 1

                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: "Both blue bands should sit at the START edge of their grey
                      box.\n\nFAIL: the TEST band is centered.\n\n(Ignore any small size
                      difference between the boxes.)"
                    text_appearance:
                      color:
                        default:
                          hex: "#000000"
                          alpha: 1
                      alignment: center
                      font_size: 15
                  margin:
                    top: 12
              margin:
                top: 16
                bottom: 16
                start: 16
                end: 16
              position:
                horizontal: center
                vertical: center

        # ------------------------------------------------------------------ 3
        # A separate question, found while writing pages 1 and 2: what a PERCENT child of a
        # ratio-sized stack resolves against. Same two boxes, but the band inside each is
        # `100% / auto` rather than a fixed size.
        #
        # The cross axis of a stack is settled by measuring it, and a ratio-sized box has a
        # width whether it was declared or derived, so the band has something to take a share
        # of either way. Where it doesn't - both axes auto, nothing declaring a length - the
        # documented answer on both platforms as of iOS #3947 / android #2142 is that the
        # percentage falls back to the band's own content, not that it collapses.
        - identifier: percent-child-of-ratio-parent-vertical
          view:
            type: container
            items:
            - size:
                width: 100%
                height: 100%
              view:
                type: linear_layout
                direction: vertical
                items:
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: 3 - percent-child-of-ratio-parent-vertical
                    text_appearance:
                      color:
                        default:
                          hex: "#888888"
                          alpha: 1
                      alignment: center
                      font_size: 11
                  margin:
                    bottom: 2
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: percent child, vertical ratio stack
                    text_appearance:
                      color:
                        default:
                          hex: "#000000"
                          alpha: 1
                      alignment: center
                      font_size: 15
                  margin:
                    bottom: 12

                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: 'CONTROL - 100% / auto + aspect_ratio 3.0'
                    text_appearance:
                      color:
                        default:
                          hex: "#000000"
                          alpha: 1
                      alignment: center
                      font_size: 14
                  margin:
                    bottom: 2
                - size:
                    width: 100%
                    height: auto
                    aspect_ratio: 3.0
                  view:
                    type: linear_layout
                    direction: vertical
                    background_color:
                      default:
                        hex: "#eeeeee"
                        alpha: 1
                    items:
                    - size:
                        width: 100%
                        height: auto
                      view:
                        type: label
                        text: 100% wide band
                        text_appearance:
                          color:
                            default:
                              hex: "#ffffff"
                              alpha: 1
                          alignment: center
                          font_size: 13
                        background_color:
                          default:
                            hex: "#33aa55"
                            alpha: 1
                  margin:
                    bottom: 12

                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: 'TEST - auto / auto + aspect_ratio 3.0'
                    text_appearance:
                      color:
                        default:
                          hex: "#000000"
                          alpha: 1
                      alignment: center
                      font_size: 14
                  margin:
                    bottom: 2
                - size:
                    width: auto
                    height: auto
                    aspect_ratio: 3.0
                  view:
                    type: linear_layout
                    direction: vertical
                    background_color:
                      default:
                        hex: "#eeeeee"
                        alpha: 1
                    items:
                    - size:
                        width: 100%
                        height: auto
                      view:
                        type: label
                        text: 100% wide band
                        text_appearance:
                          color:
                            default:
                              hex: "#ffffff"
                              alpha: 1
                          alignment: center
                          font_size: 13
                        background_color:
                          default:
                            hex: "#33aa55"
                            alpha: 1

                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: "Both grey boxes should be visible, each with a green band in
                      it.\n\nFAIL: a box is missing entirely."
                    text_appearance:
                      color:
                        default:
                          hex: "#000000"
                          alpha: 1
                      alignment: center
                      font_size: 15
                  margin:
                    top: 12
              margin:
                top: 16
                bottom: 16
                start: 16
                end: 16
              position:
                horizontal: center
                vertical: center

        # ------------------------------------------------------------------ 4
        # Page 3 on the other axis: a `auto / 100%` band inside a horizontal ratio stack, so
        # the percentage is of the stack's HEIGHT. For the CONTROL that height is the one the
        # ratio derived from a declared width, which is a real length and should serve as the
        # base like any other.
        - identifier: percent-child-of-ratio-parent-horizontal
          view:
            type: container
            items:
            - size:
                width: 100%
                height: 100%
              view:
                type: linear_layout
                direction: vertical
                items:
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: 4 - percent-child-of-ratio-parent-horizontal
                    text_appearance:
                      color:
                        default:
                          hex: "#888888"
                          alpha: 1
                      alignment: center
                      font_size: 11
                  margin:
                    bottom: 2
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: percent child, horizontal ratio stack
                    text_appearance:
                      color:
                        default:
                          hex: "#000000"
                          alpha: 1
                      alignment: center
                      font_size: 15
                  margin:
                    bottom: 12

                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: 'CONTROL - 100% / auto + aspect_ratio 3.0'
                    text_appearance:
                      color:
                        default:
                          hex: "#000000"
                          alpha: 1
                      alignment: center
                      font_size: 14
                  margin:
                    bottom: 2
                - size:
                    width: 100%
                    height: auto
                    aspect_ratio: 3.0
                  view:
                    type: linear_layout
                    direction: horizontal
                    background_color:
                      default:
                        hex: "#eeeeee"
                        alpha: 1
                    items:
                    - size:
                        width: auto
                        height: 100%
                      view:
                        type: label
                        text: full height
                        text_appearance:
                          color:
                            default:
                              hex: "#ffffff"
                              alpha: 1
                          alignment: center
                          font_size: 13
                        background_color:
                          default:
                            hex: "#5588ff"
                            alpha: 1
                  margin:
                    bottom: 12

                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: 'TEST - auto / auto + aspect_ratio 3.0'
                    text_appearance:
                      color:
                        default:
                          hex: "#000000"
                          alpha: 1
                      alignment: center
                      font_size: 14
                  margin:
                    bottom: 2
                - size:
                    width: auto
                    height: auto
                    aspect_ratio: 3.0
                  view:
                    type: linear_layout
                    direction: horizontal
                    background_color:
                      default:
                        hex: "#eeeeee"
                        alpha: 1
                    items:
                    - size:
                        width: auto
                        height: 100%
                      view:
                        type: label
                        text: full height
                        text_appearance:
                          color:
                            default:
                              hex: "#ffffff"
                              alpha: 1
                          alignment: center
                          font_size: 13
                        background_color:
                          default:
                            hex: "#5588ff"
                            alpha: 1

                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: "Both grey boxes should be visible, each with a blue band in
                      it.\n\nFAIL: a box is missing entirely."
                    text_appearance:
                      color:
                        default:
                          hex: "#000000"
                          alpha: 1
                      alignment: center
                      font_size: 15
                  margin:
                    top: 12
              margin:
                top: 16
                bottom: 16
                start: 16
                end: 16
              position:
                horizontal: center
                vertical: center
