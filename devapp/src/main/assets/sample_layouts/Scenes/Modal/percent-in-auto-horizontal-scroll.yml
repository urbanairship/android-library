# Horizontal scroll with percent-sized children — percentBaseWidth / uncappedAxes on the width axis.
#
# Separate from percent-in-auto-all-cases because that scene is a horizontal pager, which takes
# the sideways drag before a horizontal scroll inside it ever sees it.
version: 1
presentation:
  type: modal
  dismiss_on_touch_outside: true
  default_placement:
    size:
      width: 92%
      height: 92%
    position:
      horizontal: center
      vertical: center
    shade_color:
      default:
        hex: "#000000"
        alpha: 0.6
view:
  type: container
  items:
  - size:
      width: 100%
      height: 100%
    view:
      type: linear_layout
      direction: vertical
      items:
      - size:
          width: 100%
          height: auto
        view:
          type: label
          text: 'Horizontal scroll: percent of the viewport'
          text_appearance:
            color:
              default:
                hex: "#000000"
                alpha: 1
            alignment: center
            font_size: 15
        margin:
          bottom: 12
      - size:
          width: 100%
          height: 160
        view:
          type: scroll_layout
          direction: horizontal
          view:
            type: linear_layout
            direction: horizontal
            items:
            - size:
                width: 100%
                height: 100%
              view:
                type: label
                text: 100% of viewport
                text_appearance:
                  color:
                    default:
                      hex: "#000000"
                      alpha: 1
                  alignment: center
                  font_size: 14
                background_color:
                  default:
                    hex: "#ff5555"
                    alpha: 1
            - size:
                width: 50%
                height: 100%
              view:
                type: label
                text: 50%
                text_appearance:
                  color:
                    default:
                      hex: "#ffffff"
                      alpha: 1
                  alignment: center
                  font_size: 14
                background_color:
                  default:
                    hex: "#5588ff"
                    alpha: 1
            - size:
                width: 25%
                height: 100%
              view:
                type: label
                text: 25%
                text_appearance:
                  color:
                    default:
                      hex: "#ffffff"
                      alpha: 1
                  alignment: center
                  font_size: 14
                background_color:
                  default:
                    hex: "#33aa55"
                    alpha: 1
      - size:
          width: 100%
          height: auto
        view:
          type: label
          text: Drag sideways. First block fills the width, then half, then a quarter
            — 1.75 screens wide.
          text_appearance:
            color:
              default:
                hex: "#444444"
                alpha: 1
            alignment: center
            font_size: 12
        margin:
          top: 12
    margin:
      top: 16
      bottom: 16
      start: 16
      end: 16
    position:
      horizontal: center
      vertical: center
  background_color:
    default:
      hex: "#ffffff"
      alpha: 1
