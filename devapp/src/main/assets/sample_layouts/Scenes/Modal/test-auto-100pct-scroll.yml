---
# Tests: Scroll layout with auto width + 100% width child (cross-axis fill).
#
# The scroll view itself has auto width (inherits from auto modal).
# The blue bar inside is width=100% — it should fill the scroll viewport width.
# There is enough content to make the view scrollable.
#
# PASS: blue bar stretches to match the label/scroll width.
# FAIL: blue bar is invisible (zero width) — 100% of nil = nil.
version: 1
presentation:
  type: modal
  dismiss_on_touch_outside: true
  default_placement:
    size:
      width: auto
      height: auto
      max_height: 70%
    position:
      horizontal: center
      vertical: center
    shade_color:
      default:
        hex: "#000000"
        alpha: 0.4
view:
  type: scroll_layout
  direction: vertical
  view:
    type: linear_layout
    direction: vertical
    background_color:
      default:
        hex: "#F5F5F5"
        alpha: 1
    items:
    - size:
        width: 100%
        height: 48
      view:
        type: linear_layout
        direction: horizontal
        background_color:
          default:
            hex: "#4444FF"
            alpha: 0.5
        items: []
    - size:
        width: auto
        height: auto
      margin:
        top: 8
        bottom: 16
        start: 16
        end: 16
      view:
        type: label
        text: "Scroll: auto width\nBlue bar above = 100% width\n(should fill scroll viewport)"
        text_appearance:
          font_size: 16
          color:
            default:
              hex: "#000000"
              alpha: 1
          alignment: center
          styles: []
          font_families:
          - sans-serif
    - size:
        width: auto
        height: auto
      margin:
        top: 4
        bottom: 4
        start: 16
        end: 16
      view:
        type: label
        text: "Scroll content line 1 — keep scrolling"
        text_appearance:
