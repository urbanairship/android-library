# Adversarial cases for the percent-in-auto-parent work (PR #2126 + #2132).
#
# One page per finding. Every page states what a PASS looks like; if the page renders the
# way its caption describes as the failure, the finding reproduces.
#
# Pages 1 and 2 are regressions — the same shapes render correctly on the commit before
# #2126. Pages 3, 4 and 5 are new or newly-visible inconsistencies in how a stack sizes a
# child that is a percent of its CROSS axis. Page 6 is an asymmetry in ContainerLayoutView
# between an AT_MOST parent and a scroll viewport. All six are fixed.
#
# Pages 7 and 8 concern aspect_ratio rather than percent, and are also fixed. They came out
# of page 2: it used a label for its ratio row, and a label turns out to be the one thing
# that makes 7 visible. Page 2 now uses an empty_view so it tests only what it is named
# for, and the two questions the label was quietly raising each got a page of their own.
version: 1
presentation:
  type: modal
  dismiss_on_touch_outside: true
  default_placement:
    size:
      width: 92%
      height: 92%
    position:
      horizontal: center
      vertical: center
    shade_color:
      default:
        hex: "#000000"
        alpha: 0.6
view:
  type: pager_controller
  identifier: percent-adversarial-pager
  view:
    type: container
    items:
    - size:
        width: 100%
        height: 100%
      view:
        type: pager
        disable_swipe: false
        items:

        # ------------------------------------------------------------------ 1
        # REGRESSION. An auto stack whose percentages sum to >= 1 now takes the whole
        # AT_MOST it was handed, even when that AT_MOST is the remaining budget of a
        # FIXED-height ancestor rather than an exclusive ceiling. Everything after it in
        # the parent is measured against nothing and collapses.
        #
        # AutoSizeProvider (#2132) only closes this when the nearest ancestor that owns a
        # length is itself auto. Here the ancestor is fixed, so isAutoSized() is false and
        # solveMainAxisLength() returns the spec size.
        - identifier: greedy-nested-percent
          view:
            type: container
            items:
            - size:
                width: 100%
                height: 100%
              view:
                type: linear_layout
                direction: vertical
                items:
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: 1 - greedy-nested-percent
                    text_appearance:
                      color:
                        default:
                          hex: "#888888"
                          alpha: 1
                      alignment: center
                      font_size: 11
                  margin:
                    bottom: 2
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: 'Auto stack, P >= 1, inside a FIXED stack'
                    text_appearance:
                      color:
                        default:
                          hex: "#000000"
                          alpha: 1
                      alignment: center
                      font_size: 15
                  margin:
                    bottom: 12
                - size:
                    width: 100%
                    height: 300
                  view:
                    type: linear_layout
                    direction: vertical
                    items:
                    - size:
                        width: 100%
                        height: 120
                      view:
                        type: label
                        text: 120dp fixed header
                        text_appearance:
                          color:
                            default:
                              hex: "#000000"
                              alpha: 1
                          alignment: center
                          font_size: 14
                        background_color:
                          default:
                            hex: "#ff5555"
                            alpha: 1
                    - size:
                        width: 100%
                        height: auto
                      view:
                        type: linear_layout
                        direction: vertical
                        items:
                        - size:
                            width: 100%
                            height: 100%
                          view:
                            type: label
                            text: auto stack with one 100% row
                            text_appearance:
                              color:
                                default:
                                  hex: "#ffffff"
                                  alpha: 1
                              alignment: center
                              font_size: 13
                            background_color:
                              default:
                                hex: "#5588ff"
                                alpha: 1
                    - size:
                        width: 100%
                        height: auto
                      view:
                        type: label
                        text: FOOTER - must be visible
                        text_appearance:
                          color:
                            default:
                              hex: "#ffffff"
                              alpha: 1
                          alignment: center
                          font_size: 14
                        background_color:
                          default:
                            hex: "#33aa55"
                            alpha: 1
                    background_color:
                      default:
                        hex: "#dddddd"
                        alpha: 1
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: 'PASS: blue is one line of text tall and the green footer is
                      visible under it, with grey showing below. FAIL: blue swallows the
                      180dp left after the red header and the green footer is GONE. The
                      inner stack has no fixed size to take a percentage of - it should
                      size to its content, exactly as the auto-ancestor case does. Renders
                      correctly on the commit before #2126 (blue 40 / footer 30 of 300).'
                    text_appearance:
                      color:
                        default:
                          hex: "#444444"
                          alpha: 1
                      alignment: center
                      font_size: 12
                  margin:
                    top: 12
              margin:
                top: 16
                bottom: 16
                start: 16
                end: 16
              position:
                horizontal: center
                vertical: center

        # ------------------------------------------------------------------ 2
        # REGRESSION. In an AT_MOST stack, the deferred aspect_ratio pass overwrites the
        # height the stack reports with `totalLengthAfterFirstPass + ratio heights`. That
        # first-pass total counts a percent child's MARGINS only, never the slot it was
        # given, so the stack reports itself short by the whole percent slot and its
        # children draw outside it.
        - identifier: ratio-plus-percent-underreports
          view:
            type: container
            items:
            - size:
                width: 100%
                height: 100%
              view:
                type: linear_layout
                direction: vertical
                items:
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: 2 - ratio-plus-percent-underreports
                    text_appearance:
                      color:
                        default:
                          hex: "#888888"
                          alpha: 1
                      alignment: center
                      font_size: 11
                  margin:
                    bottom: 2
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: aspect_ratio beside a percent row
                    text_appearance:
                      color:
                        default:
                          hex: "#000000"
                          alpha: 1
                      alignment: center
                      font_size: 15
                  margin:
                    bottom: 12
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: linear_layout
                    direction: vertical
                    items:
                    - size:
                        width: 100%
                        height: 100
                      view:
                        type: label
                        text: 100dp fixed
                        text_appearance:
                          color:
                            default:
                              hex: "#000000"
                              alpha: 1
                          alignment: center
                          font_size: 14
                        background_color:
                          default:
                            hex: "#ff5555"
                            alpha: 1
                    - size:
                        width: 100%
                        height: 50%
                      view:
                        type: label
                        text: 50% row
                        text_appearance:
                          color:
                            default:
                              hex: "#ffffff"
                              alpha: 1
                          alignment: center
                          font_size: 14
                        background_color:
                          default:
                            hex: "#5588ff"
                            alpha: 1
                    - size:
                        width: auto
                        height: auto
                        aspect_ratio: 2.0
                      view:
                        type: empty_view
                        background_color:
                          default:
                            hex: "#33aa55"
                            alpha: 1
                    background_color:
                      default:
                        hex: "#dddddd"
                        alpha: 1
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: 'PASS: the grey background ends at the bottom of the green row and
                      this caption sits below it. FAIL: green hangs past the grey and
                      overlaps this caption. How tall BLUE should be is page 8''s question.'
                    text_appearance:
                      color:
                        default:
                          hex: "#444444"
                          alpha: 1
                      alignment: center
                      font_size: 12
                  margin:
                    top: 12
              margin:
                top: 16
                bottom: 16
                start: 16
                end: 16
              position:
                horizontal: center
                vertical: center

        # ------------------------------------------------------------------ 3
        # A cross-axis percent child is deliberately excluded from the stack's width in
        # the first pass - but the post-distribution rebuild loop, which only runs when
        # some OTHER child has a MAIN-axis percent, adds it straight back in at its
        # WRAP_CONTENT width. Adding an unrelated percent-height row therefore changes
        # how wide the stack is and how wide the percent-width bar comes out.
        - identifier: cross-axis-width-flips-on-sibling
          view:
            type: container
            items:
            - size:
                width: 100%
                height: 100%
              view:
                type: linear_layout
                direction: vertical
                items:
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: 3 - cross-axis-width-flips-on-sibling
                    text_appearance:
                      color:
                        default:
                          hex: "#888888"
                          alpha: 1
                      alignment: center
                      font_size: 11
                  margin:
                    bottom: 2
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: Same 50% bar, one extra sibling
                    text_appearance:
                      color:
                        default:
                          hex: "#000000"
                          alpha: 1
                      alignment: center
                      font_size: 15
                  margin:
                    bottom: 12
                - size:
                    width: auto
                    height: auto
                  view:
                    type: linear_layout
                    direction: vertical
                    items:
                    - size:
                        width: 50%
                        height: 26
                      view:
                        type: label
                        text: A - 50% wide
                        text_appearance:
                          color:
                            default:
                              hex: "#ffffff"
                              alpha: 1
                          alignment: center
                          font_size: 12
                        background_color:
                          default:
                            hex: "#5588ff"
                            alpha: 1
                    - size:
                        width: 200
                        height: 26
                      view:
                        type: label
                        text: 200dp reference
                        text_appearance:
                          color:
                            default:
                              hex: "#000000"
                              alpha: 1
                          alignment: center
                          font_size: 12
                        background_color:
                          default:
                            hex: "#cccccc"
                            alpha: 1
                    background_color:
                      default:
                        hex: "#eeeeee"
                        alpha: 1
                  position:
                    horizontal: start
                    vertical: top
                  margin:
                    bottom: 12
                - size:
                    width: auto
                    height: auto
                  view:
                    type: linear_layout
                    direction: vertical
                    items:
                    - size:
                        width: 50%
                        height: 26
                      view:
                        type: label
                        text: B - 50% wide
                        text_appearance:
                          color:
                            default:
                              hex: "#ffffff"
                              alpha: 1
                          alignment: center
                          font_size: 12
                        background_color:
                          default:
                            hex: "#5588ff"
                            alpha: 1
                    - size:
                        width: 200
                        height: 26
                      view:
                        type: label
                        text: 200dp reference
                        text_appearance:
                          color:
                            default:
                              hex: "#000000"
                              alpha: 1
                          alignment: center
                          font_size: 12
                        background_color:
                          default:
                            hex: "#cccccc"
                            alpha: 1
                    - size:
                        width: 100%
                        height: 25%
                      view:
                        type: label
                        text: unrelated 25%-HEIGHT row
                        text_appearance:
                          color:
                            default:
                              hex: "#000000"
                              alpha: 1
                          alignment: center
                          font_size: 12
                        background_color:
                          default:
                            hex: "#ffbb44"
                            alpha: 1
                    background_color:
                      default:
                        hex: "#eeeeee"
                        alpha: 1
                  position:
                    horizontal: start
                    vertical: top
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: 'PASS: both blue bars are the same width - half the 200dp
                      reference - and both stacks are as wide as the reference. FAIL: adding
                      the orange percent-HEIGHT row widens stack B to the full modal and
                      blue B comes out roughly twice as wide as blue A. The percent-width
                      bar is supposed to have no say in the stack width in either case.'
                    text_appearance:
                      color:
                        default:
                          hex: "#444444"
                          alpha: 1
                      alignment: center
                      font_size: 12
                  margin:
                    top: 12
              margin:
                top: 16
                bottom: 16
                start: 16
                end: 16
              position:
                horizontal: center
                vertical: center

        # ------------------------------------------------------------------ 4
        # The deferred cross-axis pass re-measures the child at its resolved width but
        # PINS the height to what it measured at WRAP_CONTENT. Anything whose height
        # depends on its width - a label, most obviously - keeps the height it had when
        # it was wide and gets clipped once it is narrow.
        - identifier: cross-axis-height-pinned
          view:
            type: container
            items:
            - size:
                width: 100%
                height: 100%
              view:
                type: linear_layout
                direction: vertical
                items:
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: 4 - cross-axis-height-pinned
                    text_appearance:
                      color:
                        default:
                          hex: "#888888"
                          alpha: 1
                      alignment: center
                      font_size: 11
                  margin:
                    bottom: 2
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: Reflowing text at a percent width
                    text_appearance:
                      color:
                        default:
                          hex: "#000000"
                          alpha: 1
                      alignment: center
                      font_size: 15
                  margin:
                    bottom: 12
                - size:
                    width: auto
                    height: auto
                  view:
                    type: linear_layout
                    direction: vertical
                    items:
                    - size:
                        width: 50%
                        height: auto
                      view:
                        type: label
                        text: This paragraph is 50% wide and auto height. It is first
                          measured at its full content width, where it needs only a
                          couple of lines, and then re-measured at half the stack width
                          with that two-line height nailed on. Every word you cannot
                          read here is the bug.
                        text_appearance:
                          color:
                            default:
                              hex: "#ffffff"
                              alpha: 1
                          alignment: start
                          font_size: 13
                        background_color:
                          default:
                            hex: "#5588ff"
                            alpha: 1
                    - size:
                        width: 300
                        height: 26
                      view:
                        type: label
                        text: 300dp reference
                        text_appearance:
                          color:
                            default:
                              hex: "#000000"
                              alpha: 1
                          alignment: center
                          font_size: 12
                        background_color:
                          default:
                            hex: "#cccccc"
                            alpha: 1
                    background_color:
                      default:
                        hex: "#eeeeee"
                        alpha: 1
                  position:
                    horizontal: start
                    vertical: top
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: 'PASS: the whole paragraph is readable, wrapped into a column
                      half the width of the grey reference bar. FAIL: the blue box is only
                      a line or two tall and the paragraph is cut off, because its height
                      was pinned to what it measured before it was narrowed.'
                    text_appearance:
                      color:
                        default:
                          hex: "#444444"
                          alpha: 1
                      alignment: center
                      font_size: 12
                  margin:
                    top: 12
              margin:
                top: 16
                bottom: 16
                start: 16
                end: 16
              position:
                horizontal: center
                vertical: center

        # ------------------------------------------------------------------ 5
        # Two rules for one thing. A child that is a percent on the cross axis ONLY goes
        # through the deferred pass and resolves against the stack's measured width. A
        # child that is a percent on BOTH axes never reaches that list - it is handled by
        # the main-axis distribution, which still resolves the cross axis against the raw
        # AT_MOST spec size. Pre-existing, but now the two paths disagree.
        - identifier: both-axes-percent-uses-ceiling
          view:
            type: container
            items:
            - size:
                width: 100%
                height: 100%
              view:
                type: linear_layout
                direction: vertical
                items:
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: 5 - both-axes-percent-uses-ceiling
                    text_appearance:
                      color:
                        default:
                          hex: "#888888"
                          alpha: 1
                      alignment: center
                      font_size: 11
                  margin:
                    bottom: 2
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: 50% width alone vs 50% width + 50% height
                    text_appearance:
                      color:
                        default:
                          hex: "#000000"
                          alpha: 1
                      alignment: center
                      font_size: 15
                  margin:
                    bottom: 12
                - size:
                    width: auto
                    height: auto
                  view:
                    type: linear_layout
                    direction: vertical
                    items:
                    - size:
                        width: 50%
                        height: 26
                      view:
                        type: label
                        text: 50% w, fixed h
                        text_appearance:
                          color:
                            default:
                              hex: "#ffffff"
                              alpha: 1
                          alignment: center
                          font_size: 12
                        background_color:
                          default:
                            hex: "#5588ff"
                            alpha: 1
                    - size:
                        width: 50%
                        height: 25%
                      view:
                        type: label
                        text: 50% w, 25% h
                        text_appearance:
                          color:
                            default:
                              hex: "#ffffff"
                              alpha: 1
                          alignment: center
                          font_size: 12
                        background_color:
                          default:
                            hex: "#33aa55"
                            alpha: 1
                    - size:
                        width: 160
                        height: 26
                      view:
                        type: label
                        text: 160dp reference
                        text_appearance:
                          color:
                            default:
                              hex: "#000000"
                              alpha: 1
                          alignment: center
                          font_size: 12
                        background_color:
                          default:
                            hex: "#cccccc"
                            alpha: 1
                    background_color:
                      default:
                        hex: "#eeeeee"
                        alpha: 1
                  position:
                    horizontal: start
                    vertical: top
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: 'PASS: blue and green are the same width, both half the grey
                      reference. FAIL: green is far wider than blue and spills past the
                      stack, because a child that is a percent on both axes resolves its
                      WIDTH against the modal-wide AT_MOST ceiling instead of against the
                      width the stack settled on.'
                    text_appearance:
                      color:
                        default:
                          hex: "#444444"
                          alpha: 1
                      alignment: center
                      font_size: 12
                  margin:
                    top: 12
              margin:
                top: 16
                bottom: 16
                start: 16
                end: 16
              position:
                horizontal: center
                vertical: center

        # ------------------------------------------------------------------ 6
        # ContainerLayoutView takes its percent base from its NON-percent items only, so a
        # container with nothing but percent items has a base of 0 and collapses. Under a
        # scroll the same container borrows the viewport and fills it. Same declaration,
        # opposite results, and the AT_MOST branch collapses hard instead of falling back
        # to content the way the UNSPECIFIED-with-no-provider branch does.
        - identifier: container-base-asymmetry
          view:
            type: container
            items:
            - size:
                width: 100%
                height: 100%
              view:
                type: linear_layout
                direction: vertical
                items:
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: 6 - container-base-asymmetry
                    text_appearance:
                      color:
                        default:
                          hex: "#888888"
                          alpha: 1
                      alignment: center
                      font_size: 11
                  margin:
                    bottom: 2
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: All-percent container - AT_MOST vs scroll
                    text_appearance:
                      color:
                        default:
                          hex: "#000000"
                          alpha: 1
                      alignment: center
                      font_size: 15
                  margin:
                    bottom: 12
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: 'A: under an auto container'
                    text_appearance:
                      color:
                        default:
                          hex: "#444444"
                          alpha: 1
                      alignment: start
                      font_size: 12
                  margin:
                    bottom: 4
                - size:
                    width: 100%
                    height: 120
                  view:
                    type: container
                    items:
                    - size:
                        width: 100%
                        height: auto
                      view:
                        type: container
                        items:
                        - size:
                            width: 100%
                            height: 100%
                          view:
                            type: label
                            text: 100% x 100%
                            text_appearance:
                              color:
                                default:
                                  hex: "#ffffff"
                                  alpha: 1
                              alignment: center
                              font_size: 13
                            background_color:
                              default:
                                hex: "#5588ff"
                                alpha: 1
                          position:
                            horizontal: center
                            vertical: center
                      position:
                        horizontal: center
                        vertical: top
                    background_color:
                      default:
                        hex: "#dddddd"
                        alpha: 1
                  margin:
                    bottom: 12
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: 'B: the same container inside a scroll'
                    text_appearance:
                      color:
                        default:
                          hex: "#444444"
                          alpha: 1
                      alignment: start
                      font_size: 12
                  margin:
                    bottom: 4
                - size:
                    width: 100%
                    height: 120
                  view:
                    type: scroll_layout
                    direction: vertical
                    view:
                      type: container
                      items:
                      - size:
                          width: 100%
                          height: 100%
                        view:
                          type: label
                          text: 100% x 100%
                          text_appearance:
                            color:
                              default:
                                hex: "#ffffff"
                                alpha: 1
                            alignment: center
                            font_size: 13
                          background_color:
                            default:
                              hex: "#33aa55"
                              alpha: 1
                        position:
                          horizontal: center
                          vertical: center
                      background_color:
                        default:
                          hex: "#dddddd"
                          alpha: 1
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: 'A and B differ, and both platforms agree on each. A falls
                      back to its content - an auto container takes its base from its
                      non-percent items and there are none, so there is nothing to take
                      a percentage of - while B borrows the 120 viewport and fills it.
                      A used to be a hard collapse to zero rather than this
                      fall-back-to-content.'
                    text_appearance:
                      color:
                        default:
                          hex: "#444444"
                          alpha: 1
                      alignment: center
                      font_size: 12
                  margin:
                    top: 12
              margin:
                top: 16
                bottom: 16
                start: 16
                end: 16
              position:
                horizontal: center
                vertical: center

        # ------------------------------------------------------------------ 7
        # aspect_ratio with BOTH axes auto. The spec (Size.kt, and pages 7-9 of
        # aspect-ratio-test-layouts.yaml) says such an item fills the available space with the
        # ratio locked. Android does. iOS pre-computes a concrete box for the one-auto cases but
        # leaves both-auto to `.aspectRatio(_:contentMode:.fit)`, which cannot stretch a view that
        # has a rigid intrinsic size — so it is a no-op on a label.
        #
        # The existing coverage all uses empty_view, which stretches, so this never showed.
        - identifier: ratio-both-auto-rigid
          view:
            type: container
            items:
            - size:
                width: 100%
                height: 100%
              view:
                type: linear_layout
                direction: vertical
                items:
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: 7 - ratio-both-auto-rigid
                    text_appearance:
                      color:
                        default:
                          hex: "#888888"
                          alpha: 1
                      alignment: center
                      font_size: 11
                  margin:
                    bottom: 2
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: aspect_ratio on stretchy vs rigid content
                    text_appearance:
                      color:
                        default:
                          hex: "#000000"
                          alpha: 1
                      alignment: center
                      font_size: 15
                  margin:
                    bottom: 12
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: linear_layout
                    direction: vertical
                    items:
                    - size:
                        width: 100%
                        height: auto
                        aspect_ratio: 3.0
                      view:
                        type: empty_view
                        background_color:
                          default:
                            hex: "#8854d0"
                            alpha: 1
                      margin:
                        bottom: 6
                    - size:
                        width: 100%
                        height: auto
                        aspect_ratio: 3.0
                      view:
                        type: label
                        text: 100% / auto
                        text_appearance:
                          color:
                            default:
                              hex: "#ffffff"
                              alpha: 1
                          alignment: center
                          font_size: 13
                        background_color:
                          default:
                            hex: "#33aa55"
                            alpha: 1
                      margin:
                        bottom: 6
                    - size:
                        width: auto
                        height: auto
                        aspect_ratio: 3.0
                      view:
                        type: label
                        text: auto / auto
                        text_appearance:
                          color:
                            default:
                              hex: "#ffffff"
                              alpha: 1
                          alignment: center
                          font_size: 13
                        background_color:
                          default:
                            hex: "#5588ff"
                            alpha: 1
                      margin:
                        bottom: 6
                    - size:
                        width: auto
                        height: auto
                        aspect_ratio: 3.0
                      view:
                        type: empty_view
                        background_color:
                          default:
                            hex: "#00b894"
                            alpha: 1
                    background_color:
                      default:
                        hex: "#eeeeee"
                        alpha: 1
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: 'PASS: all four bars are the same box, each three times as wide
                      as it is tall. A 2x2: stretchy content (purple, teal - empty_view)
                      against rigid (green, blue - label), and a declared width (purple,
                      green - 100%) against a derived one (blue, teal - auto). FAIL: any
                      bar shorter or narrower than the rest, or a strip of the grey
                      backing showing beside or below any of them.

                      OPEN ON iOS: the two 100% bars render about 2% short. Their box is
                      settled by the time it reaches the view - the percent gives the
                      width, the ratio gives the height - but .aspectRatio(.fit) then
                      refits it against whatever the stack proposes and shrinks it.
                      Removing that refit, or pinning the derived axis so it cannot
                      shrink, each fixes this page and breaks aspect-ratio-test-layouts
                      pages 3 and 4, where items genuinely have to shrink to fit. Android
                      is correct here.'
                    text_appearance:
                      color:
                        default:
                          hex: "#444444"
                          alpha: 1
                      alignment: center
                      font_size: 12
                  margin:
                    top: 12
              margin:
                top: 16
                bottom: 16
                start: 16
                end: 16
              position:
                horizontal: center
                vertical: center

        # ------------------------------------------------------------------ 8
        # A percent item is a fraction of the stack, so the solve `H = S / (1 - P)` needs `S` to be
        # every non-percent item. Android defers ratio items to a third pass and never adds them to
        # `S`, so the percentage describes a length the stack never has. iOS recovers `S` by
        # subtracting the resolved percent extent from its measurement, which includes them.
        - identifier: ratio-excluded-from-percent-solve
          view:
            type: container
            items:
            - size:
                width: 100%
                height: 100%
              view:
