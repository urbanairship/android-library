                            hex: "#33aa55"
                            alpha: 1
                    background_color:
                      default:
                        hex: "#dddddd"
                        alpha: 1
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: 'PASS: the blue row is exactly as tall as the red and green rows
