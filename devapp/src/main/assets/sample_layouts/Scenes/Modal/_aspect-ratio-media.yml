# aspect_ratio on media views, which nothing else in the corpus exercises.
#
# A ratio plus a length on one axis settles the other by arithmetic, and that derived length
# has to be pinned rather than treated as a ceiling — otherwise the stack undercuts it, the
# ratio breaks, and the shortfall shows as backing around the item. Each row sits on a grey
# stack so any shortfall is visible, and the rows cover both directions: rows 1 and 3 derive
# their HEIGHT from a percent width, row 2 derives its WIDTH from a fixed height.
#
# media_fit is fit_crop so the image fills its box and the box edges are what you see. All
# three rows use the same asset deliberately — the test is the box, not the picture.
version: 1
presentation:
  type: modal
  dismiss_on_touch_outside: true
  default_placement:
    size:
      width: 92%
      height: 92%
    position:
      horizontal: center
      vertical: center
    shade_color:
      default:
        hex: "#000000"
        alpha: 0.6
view:
  type: container
  items:
  - size:
      width: 100%
      height: 100%
    position:
      horizontal: center
      vertical: center
    margin:
      top: 16
      bottom: 16
      start: 16
      end: 16
    view:
      type: linear_layout
      direction: vertical
      items:
      - size:
          width: 100%
          height: auto
        margin:
          bottom: 12
        view:
          type: label
          text: 'aspect_ratio on media'
          text_appearance:
            font_size: 15
            alignment: center
            color:
              default:
                hex: '#000000'
                alpha: 1
      - size:
          width: 100%
          height: auto
        view:
          type: linear_layout
          direction: vertical
          background_color:
            default:
              hex: '#eeeeee'
              alpha: 1
          items:
          - size:
              width: 100%
              height: auto
              aspect_ratio: 1.778
            margin:
              bottom: 6
            view:
              type: media
              media_type: image
              media_fit: fit_crop
              url: https://hangar-dl.urbanairship.com/binary/public/Hx7SIqHqQDmFj6aruaAFcQ/34be6e8d-31d0-499b-886e-2b29459cb472
          - size:
              width: auto
              height: 120
              aspect_ratio: 1.0
            margin:
              bottom: 6
            view:
              type: media
              media_type: image
              media_fit: fit_crop
              url: https://hangar-dl.urbanairship.com/binary/public/Hx7SIqHqQDmFj6aruaAFcQ/34be6e8d-31d0-499b-886e-2b29459cb472
          - size:
              width: 100%
              height: auto
              aspect_ratio: 3.0
            view:
              type: media
              media_type: image
              media_fit: fit_crop
              url: https://hangar-dl.urbanairship.com/binary/public/Hx7SIqHqQDmFj6aruaAFcQ/34be6e8d-31d0-499b-886e-2b29459cb472
      - size:
          width: 100%
          height: auto
        margin:
          top: 12
        view:
          type: label
          text: 'PASS: no grey shows around any row. Row 1 is 16:9 and row 3 is 3:1, both
            full width with the height derived from it. Row 2 is 120pt tall and square, so
            its WIDTH is the derived one and it is narrower than the others. FAIL: any row
            short of full width (rows 1 and 3), not square (row 2), or grey visible above,
            below or beside a row.'
          text_appearance:
            font_size: 12
            alignment: center
            color:
              default:
                hex: '#444444'
                alpha: 1
