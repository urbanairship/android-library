# A percentage on a stack's CROSS axis, where that axis is auto.
#
# `LinearLayout.parentConstraints()` fills the cross axis in from the measurement and says items
# can't grow it, so a percentage there resolves against something that doesn't depend on it. That
# holds only while the cross axis is fixed. When it is auto the stack takes its width from its
# widest child, so a percent child that IS the widest child is a fraction of a length it sets
# itself: w = 0.5w, which walks to zero a pass at a time.
#
# Three cases, each a vertical stack with a green band inside, differing only in what decides the
# stack's width:
#
#   1 DECLARED  - stack is 100% wide. The band takes half of a length it had no part in setting.
#   2 SIBLING   - stack is auto, and a 200pt bar sets its width. The band is half of that bar.
#   3 SELF      - stack is auto and the band is the only child. Nothing else supplies a width, so
#                 by the same rule the stack axis follows, the percentage has no basis and the
#                 band should fall back to its own content.
#
# 1 and 2 are the working cases and are here to prove the mechanism is sound where a basis exists.
# 3 is the one under test.
version: 1
presentation:
  type: modal
  dismiss_on_touch_outside: true
  default_placement:
    size:
      width: 92%
      height: 92%
    position:
      horizontal: center
      vertical: center
    shade_color:
      default:
        hex: "#000000"
        alpha: 0.6
view:
  type: pager_controller
  identifier: percent-cross-axis-pager
  view:
    type: container
    background_color:
      default:
        hex: "#ffffff"
        alpha: 1
    items:
    - size:
        width: 100%
        height: 100%
      position:
        horizontal: center
        vertical: center
      view:
        type: pager
        disable_swipe: false
        items:

        # ------------------------------------------------------------------ 1
        - identifier: cross-axis-percent
          view:
            type: container
            items:
            - size:
                width: 100%
                height: 100%
              view:
                type: linear_layout
                direction: vertical
                items:
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: 1 - cross-axis-percent
                    text_appearance:
                      color:
                        default:
                          hex: "#888888"
                          alpha: 1
                      alignment: center
                      font_size: 11
                  margin:
                    bottom: 2
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: 50% wide child, auto-wide column
                    text_appearance:
                      color:
                        default:
                          hex: "#000000"
                          alpha: 1
                      alignment: center
                      font_size: 15
                  margin:
                    bottom: 12

                # 1 DECLARED — the stack is 100% wide, so the band is half the page.
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: '1 DECLARED - stack 100% wide'
                    text_appearance:
                      color:
                        default:
                          hex: "#000000"
                          alpha: 1
                      alignment: center
                      font_size: 14
                  margin:
                    bottom: 2
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: linear_layout
                    direction: vertical
                    background_color:
                      default:
                        hex: "#eeeeee"
                        alpha: 1
                    items:
                    - size:
                        width: 50%
                        height: 28
                      view:
                        type: label
                        text: 50%
                        text_appearance:
                          color:
                            default:
                              hex: "#ffffff"
                              alpha: 1
                          alignment: center
                          font_size: 13
                        background_color:
                          default:
                            hex: "#33aa55"
                            alpha: 1
                  margin:
                    bottom: 12

                # 2 SIBLING — the stack is auto, and the 200pt bar is what sets its width.
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: '2 SIBLING - stack auto, 200pt bar sets the width'
                    text_appearance:
                      color:
                        default:
                          hex: "#000000"
                          alpha: 1
                      alignment: center
                      font_size: 14
                  margin:
                    bottom: 2
                - size:
                    width: auto
                    height: auto
                  view:
                    type: linear_layout
                    direction: vertical
                    background_color:
                      default:
                        hex: "#eeeeee"
                        alpha: 1
                    items:
                    - size:
                        width: 200
                        height: 20
                      view:
                        type: label
                        text: 200pt
                        text_appearance:
                          color:
                            default:
                              hex: "#ffffff"
                              alpha: 1
                          alignment: center
                          font_size: 12
                        background_color:
                          default:
                            hex: "#888888"
                            alpha: 1
                    - size:
                        width: 50%
                        height: 28
                      view:
                        type: label
                        text: 50%
                        text_appearance:
                          color:
                            default:
                              hex: "#ffffff"
                              alpha: 1
                          alignment: center
                          font_size: 13
                        background_color:
                          default:
                            hex: "#33aa55"
                            alpha: 1
                  margin:
                    bottom: 12

                # 3 SELF — the stack is auto and the band is its only child.
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: '3 SELF - stack auto, band is the only child'
                    text_appearance:
                      color:
                        default:
                          hex: "#000000"
                          alpha: 1
                      alignment: center
                      font_size: 14
                  margin:
                    bottom: 2
                - size:
                    width: auto
                    height: auto
                  view:
                    type: linear_layout
                    direction: vertical
                    background_color:
                      default:
                        hex: "#eeeeee"
                        alpha: 1
                    items:
                    - size:
                        width: 50%
                        height: 28
                      view:
                        type: label
                        text: 50% of nothing
                        text_appearance:
                          color:
                            default:
                              hex: "#ffffff"
                              alpha: 1
                          alignment: center
                          font_size: 13
                        background_color:
                          default:
                            hex: "#33aa55"
                            alpha: 1

                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: "1 half the page. 2 half the grey bar above it.\n\n3 as wide as its own
                      text.\n\nFAIL: any band is a sliver, or missing."
                    text_appearance:
                      color:
                        default:
                          hex: "#000000"
                          alpha: 1
                      alignment: center
                      font_size: 14
                  margin:
                    top: 12
              margin:
                top: 16
                bottom: 16
                start: 16
                end: 16
              position:
                horizontal: center
                vertical: center

        # ------------------------------------------------------------------ 2
        # The same thing on the other axis. A horizontal row takes its HEIGHT from its tallest item,
        # so a `height: 50%` child that is also the tallest is a fraction of a length it sets itself.
        # The vertical path was fixed first; this is the twin that shares none of its code.
        - identifier: cross-axis-percent-horizontal
          view:
            type: container
            items:
            - size:
                width: 100%
                height: 100%
              view:
                type: linear_layout
                direction: vertical
                items:
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: 2 - 50% tall child, auto-tall row
                    text_appearance:
                      color:
                        default:
                          hex: "#000000"
                          alpha: 1
                      alignment: center
                      font_size: 15
                  margin:
                    bottom: 12

                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: '1 DECLARED - row 120 tall'
                    text_appearance:
                      color:
                        default:
                          hex: "#666666"
                          alpha: 1
                      alignment: center
                      font_size: 12
                  margin:
                    bottom: 2
                - size:
                    width: 100%
                    height: 120
                  view:
                    type: linear_layout
                    direction: horizontal
                    background_color:
                      default:
                        hex: "#eeeeee"
                        alpha: 1
                    items:
                    - size:
                        width: 120
                        height: 50%
                      view:
                        type: label
                        text: 50%
                        text_appearance:
                          color:
                            default:
                              hex: "#ffffff"
                              alpha: 1
                          alignment: center
                          font_size: 12
                        background_color:
                          default:
                            hex: "#5588ff"
                            alpha: 1
                  margin:
                    bottom: 12

                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: '2 SIBLING - row auto, an 80pt block sets the height'
                    text_appearance:
                      color:
                        default:
                          hex: "#666666"
                          alpha: 1
                      alignment: center
                      font_size: 12
                  margin:
                    bottom: 2
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: linear_layout
                    direction: horizontal
                    background_color:
                      default:
                        hex: "#eeeeee"
                        alpha: 1
                    items:
                    - size:
                        width: 120
                        height: 80
                      margin:
                        end: 8
                      view:
                        type: label
                        text: 80pt
                        text_appearance:
                          color:
                            default:
                              hex: "#ffffff"
                              alpha: 1
                          alignment: center
                          font_size: 12
                        background_color:
                          default:
                            hex: "#888888"
                            alpha: 1
                    - size:
                        width: 120
                        height: 50%
                      view:
                        type: label
                        text: 50%
                        text_appearance:
                          color:
                            default:
                              hex: "#ffffff"
                              alpha: 1
                          alignment: center
                          font_size: 12
                        background_color:
                          default:
                            hex: "#5588ff"
                            alpha: 1
                  margin:
                    bottom: 12

                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: '3 SELF - row auto, the band is the only child'
                    text_appearance:
                      color:
                        default:
                          hex: "#666666"
                          alpha: 1
                      alignment: center
                      font_size: 12
                  margin:
                    bottom: 2
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: linear_layout
                    direction: horizontal
                    background_color:
                      default:
                        hex: "#eeeeee"
                        alpha: 1
                    items:
                    - size:
                        width: 120
                        height: 50%
                      view:
                        type: label
                        text: 50% of nothing
                        text_appearance:
                          color:
                            default:
                              hex: "#ffffff"
                              alpha: 1
                          alignment: center
                          font_size: 12
                        background_color:
                          default:
                            hex: "#5588ff"
                            alpha: 1

                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: "1 half the row. 2 half the grey block beside it.\n\n3 as tall as its own
                      text.\n\nFAIL: any band is a sliver, or missing."
                    text_appearance:
                      color:
                        default:
                          hex: "#000000"
                          alpha: 1
                      alignment: center
                      font_size: 14
                  margin:
                    top: 12
              margin:
                top: 16
                bottom: 16
                start: 16
                end: 16
              position:
                horizontal: center
                vertical: center

        # ------------------------------------------------------------------ 3
        # A child that is a percent on BOTH axes. It is a main-axis percent too, so it isn't measured
        # in the first pass at all — it only joins the cross-axis set during the distribution pass,
        # which is a second place the "does anything supply a width" question has to be asked.
        #
        # The column's height is declared, so the 50% height is a straightforward half of it. Only
        # the width has nothing behind it.
        - identifier: percent-on-both-axes
          view:
            type: container
            items:
            - size:
                width: 100%
                height: 100%
              view:
                type: linear_layout
                direction: vertical
                items:
                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: 3 - percent on both axes
                    text_appearance:
                      color:
                        default:
                          hex: "#000000"
                          alpha: 1
                      alignment: center
                      font_size: 15
                  margin:
                    bottom: 12

                - size:
                    width: auto
                    height: 200
                  view:
                    type: linear_layout
                    direction: vertical
                    background_color:
                      default:
                        hex: "#eeeeee"
                        alpha: 1
                    items:
                    - size:
                        width: 50%
                        height: 50%
                      view:
                        type: label
                        text: 50% by 50%
                        text_appearance:
                          color:
                            default:
                              hex: "#ffffff"
                              alpha: 1
                          alignment: center
                          font_size: 12
                        background_color:
                          default:
                            hex: "#aa5533"
                            alpha: 1

                - size:
                    width: 100%
                    height: auto
                  view:
                    type: label
                    text: "The band is 100 tall, half the column, and as wide as its own text
                      because nothing supplies a width.\n\nFAIL: the band or the grey column is
                      missing."
                    text_appearance:
                      color:
                        default:
                          hex: "#000000"
                          alpha: 1
                      alignment: center
                      font_size: 14
                  margin:
                    top: 12
              margin:
                top: 16
                bottom: 16
                start: 16
                end: 16
              position:
                horizontal: center
                vertical: center
