# Percent-sized items inside a scroll layout.
#
# A vertical scroll measures its content unbounded so it can scroll, which leaves percent heights
# with nothing to resolve against. The base is the viewport, not the content: the blue box is
# `height: 50%` and should measure half the visible scroll area (~half the modal), while the 900dp
# red block keeps the content taller than the viewport so it still scrolls.
version: 1
presentation:
  dismiss_on_touch_outside: true
  type: modal
  default_placement:
    size:
      width: 90%
      height: 70%
    shade_color:
      default:
        hex: '#000000'
        alpha: 0.7
view:
  type: container
  background_color:
    default:
      hex: '#ffffff'
      alpha: 1
  items:
    - position:
        horizontal: center
        vertical: center
      size:
        width: 100%
        height: 100%
      view:
        type: scroll_layout
        direction: vertical
        view:
          type: container
          items:
            # Taller than the viewport, so the content scrolls.
            - position:
                horizontal: center
                vertical: top
              size:
                width: 100%
                height: 900
              view:
                type: label
                text: '900dp content (scrolls)'
                background_color:
                  default:
                    hex: '#ff5555'
                    alpha: 1
                text_appearance:
                  color:
                    default:
                      hex: '#000000'
                      alpha: 1
                  alignment: center
                  font_size: 14
            # Should measure half the viewport height — NOT half of 900dp.
            - position:
                horizontal: start
                vertical: top
              size:
                width: 60%
                height: 50%
              view:
                type: label
                text: 'height 50% = half the viewport'
                background_color:
                  default:
                    hex: '#5588ff'
                    alpha: 1
                text_appearance:
                  color:
                    default:
                      hex: '#ffffff'
                      alpha: 1
                  alignment: center
                  font_size: 14
