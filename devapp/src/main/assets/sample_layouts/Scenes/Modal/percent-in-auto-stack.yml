# Do percent children in an auto-height stack resolve against the right base?
#
# An auto-height VStack holding a fixed 120dp block and two percent blocks. "Percent of the
# parent" makes the stack's height self-referential, so the only self-consistent answer is
#
#     H = S / (1 - P) = 120 / (1 - 0.75) = 480
#
# which lands on sizes chosen to be checkable by eye:
#
#     red    120dp fixed
#     blue    25% of 480 = 120   -> same height as red
#     green   50% of 480 = 240   -> same height as red + blue together
#     stack                 480  = 120 + 120 + 240
#
# WHAT TO LOOK FOR:
#   blue == red, and green == red + blue   -> correct
#   everything much shorter, blue about a quarter of red
#                                          -> resolved against the fixed content (120) instead
#                                             of the stack, i.e. stopped after one pass
#   in between                             -> a remeasure loop that damped out partway
#
# P = 0.75 here rather than 0.5, which also makes this the slow case for anything that iterates:
# the error shrinks by a factor of P each pass, so ~110 passes to converge instead of ~55.
#
# The stack must contain ONLY these three items — any other child changes S and therefore every
# number above. The caption sits in the parent container, which is a z-stack, so it doesn't count.
version: 1
presentation:
  dismiss_on_touch_outside: true
  type: modal
  default_placement:
    size:
      width: 90%
      height: 100%
    shade_color:
      default:
        hex: '#000000'
        alpha: 0.7
view:
  type: container
  background_color:
    default:
      hex: '#ffffff'
      alpha: 1
  items:
    - position:
        horizontal: center
        vertical: top
      size:
        width: 100%
        height: auto
      margin:
        top: 24
      view:
        type: linear_layout
        direction: vertical
        background_color:
          default:
            hex: '#eeeeee'
            alpha: 1
        items:
          - size:
              width: 100%
              height: 120
            view:
              type: label
              text: '120dp fixed'
              background_color:
                default:
                  hex: '#ff5555'
                  alpha: 1
              text_appearance:
                color:
                  default:
                    hex: '#000000'
                    alpha: 1
                alignment: center
                font_size: 15
          - size:
              width: 100%
              height: 25%
            view:
              type: label
              text: '25% — should match red'
              background_color:
                default:
                  hex: '#5588ff'
                  alpha: 1
              text_appearance:
                color:
                  default:
                    hex: '#ffffff'
                    alpha: 1
                alignment: center
                font_size: 15
          - size:
              width: 100%
              height: 50%
            view:
              type: label
              text: '50% — should match red + blue'
              background_color:
                default:
                  hex: '#33aa55'
                  alpha: 1
              text_appearance:
                color:
                  default:
                    hex: '#ffffff'
                    alpha: 1
                alignment: center
                font_size: 15
    - position:
        horizontal: center
        vertical: bottom
      size:
        width: 100%
        height: auto
      margin:
        start: 16
        end: 16
        bottom: 24
      view:
        type: label
        text: 'Correct: blue = red, green = red + blue, stack = 480. If blue is roughly a quarter of red, the percentages resolved against the fixed content instead of the stack.'
        text_appearance:
          color:
            default:
              hex: '#000000'
              alpha: 1
          alignment: center
          font_size: 13
